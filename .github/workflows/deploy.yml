name: deploy

# Construye la imagen en los runners de GitHub y la publica en GHCR; el servidor
# solo la descarga. Compilar en el VPS (1 vCPU) dejaría el sitio lento varios
# minutos en cada despliegue.

on:
  push:
    branches: [main]
  workflow_dispatch: # permite relanzar un despliegue a mano

# Dos despliegues simultáneos podrían dejar el servidor en un estado ambiguo.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/axi-client

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Las NEXT_PUBLIC_* se hornean en el bundle: son build args, no variables
      # de runtime. Se pueden sobreescribir con Variables del repositorio.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://api.axi-connect.co' }}
            NEXT_PUBLIC_WS_BASE_URL=${{ vars.NEXT_PUBLIC_WS_BASE_URL || 'https://api.axi-connect.co' }}
            NEXT_PUBLIC_STORAGE_URL=${{ vars.NEXT_PUBLIC_STORAGE_URL || 'https://storage.axi-connect.co' }}
            NEXT_PUBLIC_SALES_WHATSAPP=${{ vars.NEXT_PUBLIC_SALES_WHATSAPP || '573224970950' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://axi-connect.co' }}
            NEXT_PUBLIC_GA_ID=${{ vars.NEXT_PUBLIC_GA_ID }}
            NEXT_PUBLIC_META_PIXEL_ID=${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            BUILD_SHA=${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Preparar SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Clave del host fijada como secreto: evita aceptar a ciegas la
          # identidad del servidor (TOFU) en cada ejecución.
          printf '%s\n' "${{ secrets.DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Desplegar en el servidor
        env:
          TAG: ${{ needs.build.outputs.tag }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          # Token efímero del job: el servidor no guarda credenciales del
          # registry de forma permanente.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # El token entra por stdin, nunca como argumento (sería visible en la
          # lista de procesos del servidor).
          printf '%s' "$GHCR_TOKEN" | ssh -o BatchMode=yes "$USER@$HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin \
             && /opt/apps/axi-connect/deploy-image.sh frontend '$TAG'; \
             status=\$?; docker logout ghcr.io >/dev/null 2>&1; exit \$status"

      # ⚠️ Exige la VERSIÓN, no solo un 200. Un 200 lo devuelve igual el contenedor
      # viejo, así que con la comprobación anterior un swap que no ocurría salía
      # verde — es lo que pasó en la API durante diez días (incidente 2026-08-20).
      - name: Comprobar el sitio
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          for i in $(seq 1 10); do
            body=$(curl -s https://axi-connect.co/api/version || true)
            if echo "$body" | grep -q "\"version\":\"$TAG\""; then
              echo "OK ($TAG en servicio)"; exit 0
            fi
            echo "intento $i: sirviendo otra versión (esperada $TAG): $body"; sleep 6
          done
          echo "El sitio no está sirviendo $TAG: el contenedor no se sustituyó"; exit 1
