<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>CRM · Nueva tarea</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700;800&amp;family=Poppins:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Poppins,system-ui,sans-serif;background:#F5F5F7}
.lt{--card:#FFFFFF;--fg:#0B0B0E;--fg2:#3A3A40;--mut:#6B6B73;--line:rgba(0,0,0,.07);--line2:rgba(0,0,0,.12);--chip:#F0F0F2;--brand:#D13F42;--acc:rgba(230,87,89,.12)}
.frame{width:1440px;height:900px;background:rgba(10,10,12,.42);color:var(--fg);font-family:Poppins,system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
.d{font-family:Urbanist,Poppins,sans-serif}
.dlg{width:560px;background:var(--card);border-radius:28px;box-shadow:0 50px 100px -40px rgba(0,0,0,.55);padding:28px 30px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box}
.lbl{font-size:12.5px;color:var(--fg2);font-weight:500}
.field{height:44px;border-radius:12px;border:1px solid var(--line2);padding:0 14px;font:14px Poppins,sans-serif;color:var(--fg);display:flex;align-items:center;justify-content:space-between;gap:8px;box-sizing:border-box;min-width:0}
.field span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ta{width:100%;box-sizing:border-box;min-height:72px;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);font:13.5px/1.5 Poppins,sans-serif;resize:none;outline:0}
.seg{height:34px;padding:0 14px;border-radius:999px;font:500 13px Poppins,sans-serif;color:var(--mut);border:0;background:transparent;white-space:nowrap;flex:1}
.seg-on{background:var(--acc);color:var(--fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:999px;font:500 14px Poppins,sans-serif;border:1px solid var(--line2);background:var(--card);color:var(--fg);white-space:nowrap}
.btn-p{background:var(--brand);color:#FFFFFF;border-color:var(--brand)}
</style>
</helmet>
<div class="frame lt">
  <section class="dlg" role="dialog" aria-modal="true" aria-labelledby="nt-t">
    <header><h2 id="nt-t" class="d" style="margin:0;font-size:26px;font-weight:700">Nueva tarea</h2><p style="margin:6px 0 0;font-size:13px;color:var(--mut)">Una nota, llamada, reunión o tarea con fecha y responsable.</p></header>
    <div role="radiogroup" aria-label="Tipo" style="display:flex;gap:2px;padding:3px;border-radius:999px;border:1px solid var(--line)"><button type="button" role="radio" aria-checked="false" class="seg">Nota</button><button type="button" role="radio" aria-checked="true" class="seg seg-on">Llamada</button><button type="button" role="radio" aria-checked="false" class="seg">Reunión</button><button type="button" role="radio" aria-checked="false" class="seg">Tarea</button></div>
    <div style="display:flex;flex-direction:column;gap:6px"><label class="lbl" for="nt-ti">Título</label><div class="field"><span id="nt-ti">Llamar para confirmar el grupo de 40 personas</span></div></div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
      <div style="display:flex;flex-direction:column;gap:6px;min-width:0"><span class="lbl">Contacto</span><div class="field"><span>Luis Pardo</span></div></div>
      <div style="display:flex;flex-direction:column;gap:6px;min-width:0"><span class="lbl">Responsable</span><div class="field"><span>Laura Méndez</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"></path></svg></div></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
      <div style="display:flex;flex-direction:column;gap:6px;min-width:0"><span class="lbl">Vence</span><div class="field"><span>vie 27 sep</span></div></div>
      <div style="display:flex;flex-direction:column;gap:6px;min-width:0"><span class="lbl">Hora</span><div class="field"><span>9:00 a. m.</span></div></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px"><label class="lbl" for="nt-de">Detalle (opcional)</label><textarea id="nt-de" class="ta">Pidió confirmar antes del viernes si el hotel tiene salón para 40.</textarea></div>
    <footer style="display:flex;justify-content:flex-end;gap:10px"><button type="button" class="btn">Cancelar</button><button type="button" class="btn btn-p">Crear tarea</button></footer>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
