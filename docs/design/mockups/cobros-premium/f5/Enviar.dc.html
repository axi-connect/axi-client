<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Escribirle a mano</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700;800&amp;family=Poppins:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Poppins,system-ui,sans-serif;color:#0B0B0E;background:#5A5A60}
.d{font-family:Urbanist,Poppins,sans-serif}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;font:500 14px Poppins,sans-serif;border:0;cursor:pointer}
.btn-p{background:#D13F42;color:#FFFFFF;box-shadow:0 10px 24px -10px rgba(209,63,66,.55)}
.btn-g{background:transparent;color:#0B0B0E}
.opt{display:grid;grid-template-columns:36px minmax(0,1fr) 20px;gap:12px;align-items:center;padding:14px;border-radius:18px;border:1px solid rgba(0,0,0,.10);background:#FFFFFF;font:inherit;text-align:left;cursor:pointer}
.opt-on{border-color:#0B0B0E;box-shadow:0 0 0 1px #0B0B0E}
.ic{width:36px;height:36px;border-radius:12px;background:#F0F0F2;display:flex;align-items:center;justify-content:center}
.radio{width:18px;height:18px;border-radius:999px;border:1.5px solid rgba(0,0,0,.28);box-sizing:border-box;display:flex;align-items:center;justify-content:center}
.radio-on{border-color:#0B0B0E}.radio-on::after{content:"";width:8px;height:8px;border-radius:9px;background:#0B0B0E}
</style>
</helmet>
<div style="width:1440px;height:900px;background:linear-gradient(180deg,#6A6A70,#4E4E54);display:flex;align-items:center;justify-content:center;overflow:hidden">
  <section role="dialog" aria-modal="true" aria-labelledby="en-title" style="width:580px;background:#FFFFFF;border-radius:28px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 24px 64px rgba(0,0,0,.28);padding:28px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px">
    <div style="display:flex;flex-direction:column;gap:6px">
      <span style="font-size:12px;color:#6B6B73">Cartera · Pedido #0044</span>
      <h2 id="en-title" class="d" style="margin:0;font-size:26px;font-weight:700">Escribirle a Pedro</h2>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:#F7F7F8;font-size:13px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3A3A40" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="3"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
      <span>La cuota 1 vence el <strong style="font-weight:600">jue 1 oct</strong>: toca el texto <strong style="font-weight:600">«Antes de vencer»</strong>.</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <label for="en-text" style="font-size:13px;font-weight:600">Texto que va a salir</label>
      <textarea id="en-text" style="min-height:120px;border-radius:16px;border:1px solid rgba(0,0,0,.14);padding:14px;font:14px/1.55 Poppins,sans-serif;color:#0B0B0E;resize:none">Hola Pedro, te recordamos que la cuota 1 de 2 de tu pedido #0044, por $ 4.634.663, vence el jueves 1 de octubre. Puedes pagar por Bancolombia o Nequi.</textarea>
      <span style="font-size:12px;color:#6B6B73">Puedes ajustarlo para esta vez. La plantilla no cambia.</span>
    </div>
    <div role="radiogroup" aria-label="Por dónde" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
      <button class="opt opt-on" role="radio" aria-checked="true"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B0B0E" stroke-width="1.8"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"></path></svg></span><span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:14px;font-weight:600">WhatsApp</span><span style="font-size:12px;color:#6B6B73">Escribió hace 2 h · sale ya</span></span><span class="radio radio-on"></span></button>
      <button class="opt" role="radio" aria-checked="false"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B0B0E" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg></span><span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:14px;font-weight:600">Correo</span><span style="font-size:12px;color:#6B6B73;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">p•••o@gmail.com</span></span><span class="radio"></span></button>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn btn-g">Cancelar</button><button class="btn btn-p">Enviar por WhatsApp</button></div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
