<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
#c{height:720px;background:#0B0B0E;padding:44px 44px 0}
h2{font:800 42px/1 Nexa;letter-spacing:-.035em;color:#F4F4F5}
h2 span{color:#FB7185}
.list{margin-top:30px;display:grid;gap:14px}
.r{height:180px;border-radius:20px;background:#141418;border:1px solid rgba(255,255,255,.08);position:relative;overflow:hidden;display:flex;align-items:center}
.r::before{content:"";position:absolute;right:-60px;top:-60px;width:300px;height:300px;border-radius:50%;background:var(--g);opacity:.10;filter:blur(40px)}
.txt{position:relative;padding:0 0 0 28px;width:270px}
.n{font:600 11px/1 Poppins;letter-spacing:.22em;color:var(--a)}
.txt b{display:block;margin-top:10px;font:800 30px/1 Nexa;letter-spacing:-.025em;color:#F4F4F5}
.txt p{margin-top:10px;font:400 15px/1.45 Poppins;color:#A1A1AA}
.ill{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:230px}
.ill text{font-family:Hand,cursive}
</style></head><body><div id="c">
<h2>Así trabaja <span>tu agente.</span></h2>
<div class="list">
 <div class="r" style="--g:#A78BFA;--a:#A78BFA"><div class="txt"><span class="n">01</span><b>Cotiza</b><p>Con los precios que tú cargaste. Nunca inventa descuentos.</p></div><svg class="ill" xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 252 182"><defs>

          <g filter="url(#glow-quote)">
